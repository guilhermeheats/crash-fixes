name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed artifacts
        shell: bash
        run: |
          ./scripts/verify.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mods/clchunkfix-1.1.jar
            mods/legacyjavafixer-1.0.jar
            checksums.txt
            mods.sha256
            examples/options.txt
            README.md
            LICENSE
            THIRD_PARTY.md
            CREDITS.md
