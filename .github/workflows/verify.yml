name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify repository (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/verify.sh
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py

      - name: Installer smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/mods" "$tmp/config"
          ./scripts/install.sh --game-dir "$tmp" --no-options
          test -f "$tmp/mods/clchunkfix-1.3.jar"
          test -f "$tmp/mods/legacyjavafixer-1.0.jar"

      - name: Build clchunkfix (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/forge.jar" \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.6.4-9.11.1.965/forge-1.6.4-9.11.1.965-universal.jar
          FORGE_JAR="$RUNNER_TEMP/forge.jar" ./scripts/build.sh
          test -f mods/clchunkfix-1.3.jar
          unzip -l mods/clchunkfix-1.3.jar | grep -q 'clchunkfix/core/WorldExtensionTransformer.class'
          unzip -l mods/clchunkfix-1.3.jar | grep -q 'clchunkfix/core/InvTweaksTransformer.class'
          unzip -p mods/clchunkfix-1.3.jar META-INF/MANIFEST.MF | grep -q 'FMLCorePlugin: clchunkfix.core.ChunkFixCorePlugin'

      - name: Verify repository (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parse error in $($_.Name)"
            }
          }
          .\scripts\verify.ps1

      - name: Installer smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "crash-fixes-smoke"
          New-Item -ItemType Directory -Force -Path (Join-Path $tmp "mods") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $tmp "config") | Out-Null
          .\scripts\install.ps1 -GameDir $tmp -NoOptions
          if (-not (Test-Path (Join-Path $tmp "mods\clchunkfix-1.3.jar"))) { throw "missing clchunkfix" }
          if (-not (Test-Path (Join-Path $tmp "mods\legacyjavafixer-1.0.jar"))) { throw "missing legacyjavafixer" }

      - name: Build clchunkfix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\build.ps1
          if (-not (Test-Path mods/clchunkfix-1.3.jar)) { throw "jar not built" }
          $entries = & jar tf mods/clchunkfix-1.3.jar
          if (-not ($entries -contains "clchunkfix/core/WorldExtensionTransformer.class")) {
            throw "CodeChickenLib transformer missing from clchunkfix jar"
          }
          if (-not ($entries -contains "clchunkfix/core/InvTweaksTransformer.class")) {
            throw "Inventory Tweaks transformer missing from clchunkfix jar"
          }
